{% extends "base.html" %}

{% block title %}设置 — 千卷{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="flex items-center mb-6">
        <a href="/" class="text-gray-400 hover:text-gray-600 mr-3">← 返回</a>
        <h1 class="text-2xl font-bold text-gray-800">全局设置</h1>
    </div>

    <!-- API Key 配置 -->
    <div class="bg-white rounded-lg shadow-sm border p-6 mb-6">
        <h2 class="text-lg font-semibold mb-4">API Key 配置</h2>
        <p class="text-sm text-gray-500 mb-4">API Key 仅存储在本地 .env 文件中，不会上传到任何服务器。</p>

        <form id="api-key-form" class="space-y-4">
            {% for provider in providers %}
            <div class="border rounded-lg p-4">
                <div class="flex items-center justify-between mb-2">
                    <label class="text-sm font-medium text-gray-700">
                        {{ provider.display_name }}
                        {% if provider.available %}
                        <span class="text-green-500 text-xs ml-1">✓ 已配置</span>
                        {% else %}
                        <span class="text-gray-400 text-xs ml-1">未配置</span>
                        {% endif %}
                    </label>
                    {% if provider.available %}
                    <button type="button" onclick="testConnection('{{ provider.name }}')"
                            class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded hover:bg-gray-200 transition">
                        测试连接
                    </button>
                    {% endif %}
                </div>
                <div class="flex gap-2">
                    <input type="password" name="{{ provider.key_name }}"
                           placeholder="{{ '已配置（留空不修改）' if provider.available else '输入 API Key' }}"
                           class="flex-1 border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 text-sm">
                </div>
                <div id="test-result-{{ provider.name }}" class="mt-2 text-xs hidden"></div>
            </div>
            {% endfor %}

            <div class="flex items-center gap-3">
                <button type="submit"
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">
                    保存 API Key
                </button>
                <span id="key-status" class="text-sm text-gray-400"></span>
            </div>
        </form>
    </div>

    <!-- 默认模型选择 -->
    <div class="bg-white rounded-lg shadow-sm border p-6">
        <h2 class="text-lg font-semibold mb-4">默认模型</h2>
        <form id="model-form" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">默认 AI 提供商</label>
                <select name="default_provider" id="default-provider"
                        class="w-full border rounded-lg px-3 py-2 focus:ring-2 focus:ring-blue-500 text-sm">
                    {% for provider in providers %}
                    <option value="{{ provider.name }}" {{ 'selected' if provider.name == config.default_provider }}>
                        {{ provider.display_name }} {{ '(已配置)' if provider.available else '(未配置)' }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="flex items-center gap-3">
                <button type="submit"
                        class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">
                    保存设置
                </button>
                <span id="model-status" class="text-sm text-gray-400"></span>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('api-key-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const data = {};
    for (const input of form.querySelectorAll('input[type="password"]')) {
        if (input.value.trim()) {
            data[input.name] = input.value.trim();
        }
    }
    if (Object.keys(data).length === 0) {
        document.getElementById('key-status').textContent = '没有输入任何 Key';
        return;
    }

    const statusEl = document.getElementById('key-status');
    statusEl.textContent = '保存中...';

    const res = await fetch('/api/settings/api-keys', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data),
    });
    if (res.ok) {
        statusEl.textContent = '保存成功，刷新页面...';
        setTimeout(() => location.reload(), 800);
    } else {
        statusEl.textContent = '保存失败';
    }
});

document.getElementById('model-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const provider = document.getElementById('default-provider').value;
    const res = await fetch('/api/settings', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({default_provider: provider}),
    });
    document.getElementById('model-status').textContent = res.ok ? '保存成功' : '保存失败';
});

async function testConnection(providerName) {
    const resultEl = document.getElementById('test-result-' + providerName);
    resultEl.classList.remove('hidden');
    resultEl.className = 'mt-2 text-xs text-gray-500';
    resultEl.textContent = '测试连接中...';

    try {
        const res = await fetch('/api/settings/test-connection/' + providerName, {method: 'POST'});
        const data = await res.json();

        if (data.success) {
            resultEl.className = 'mt-2 text-xs text-green-600';
            resultEl.textContent = '✓ 连接成功 — 模型: ' + data.model + ' — 响应: ' + data.response;
        } else {
            resultEl.className = 'mt-2 text-xs text-red-600';
            resultEl.textContent = '✗ 连接失败: ' + data.error;
        }
    } catch (err) {
        resultEl.className = 'mt-2 text-xs text-red-600';
        resultEl.textContent = '✗ 请求异常: ' + err.message;
    }
}
</script>
{% endblock %}
